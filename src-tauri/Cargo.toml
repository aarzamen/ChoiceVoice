[package]
name = "choicevoice"
version = "0.1.0"
description = "ChoiceVoice — local Qwen3-TTS boombox"
authors = ["Mike Arzamendi"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "choicevoice_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1"
serde = { version = "1", features = ["derive"] }
log = "0.4"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-fs = "2"
tauri-plugin-dialog = "2"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
