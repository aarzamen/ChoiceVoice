[project]
name = "choicevoice-tts"
version = "0.1.0"
description = "ChoiceVoice local TTS sidecar"
requires-python = ">=3.12"
dependencies = [
    "mlx-audio>=0.2.9",
    "numpy>=1.26",
    "soundfile>=0.12",
    "scipy>=1.13",
]

[project.optional-dependencies]
torch = [
    "transformers>=4.57",
    "torch>=2.3",
    "torchaudio>=2.3",
    "accelerate>=1.12",
    "librosa>=0.10",
    "onnxruntime>=1.18",
    "einops>=0.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["choicevoice_tts*"]
